<!DOCTYPE html>
<!-- เพิ่มคลาส dark เพื่อให้ค่าเริ่มต้นเป็นธีมมืด และใส่ transition เพื่อให้สลับสีแบบสมูท -->
<html lang="th" class="scroll-smooth dark transition-colors duration-500">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">

    <title>Saran Thapkhwa (ศรัณ ทัพขวา) | Photography Portfolio</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class', // เปิดใช้งานระบบ Dark Mode ของ Tailwind
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], },
                    colors: { 
                        brand: { 50: '#f6f6f6', 100: '#e7e7e7', 800: '#1a1a1a', 900: '#0a0a0a' } 
                    }
                }
            }
        }
    </script>
    <style>
        /* สไตล์ Scrollbar รองรับ 2 ธีม */
        ::-webkit-scrollbar { width: 8px; }
        html.dark ::-webkit-scrollbar-track { background: #0a0a0a; }
        html.dark ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        html:not(.dark) ::-webkit-scrollbar-track { background: #f3f4f6; }
        html:not(.dark) ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        html, body {
            -webkit-user-select: none;
            -ms-user-select: none; 
            user-select: none; 
            touch-action: manipulation; 
        }

        .img-loaded { animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<!-- ปรับ body ให้รองรับการเปลี่ยนสี bg-gray-50 (สว่าง) / bg-brand-900 (มืด) -->
<body class="bg-gray-50 dark:bg-brand-900 text-gray-900 dark:text-brand-50 font-sans antialiased min-h-screen flex flex-col overflow-x-hidden w-full max-w-[100vw] transition-colors duration-500" oncontextmenu="return false;">

    <!-- Navbar: รองรับ 2 ธีม และเพิ่มปุ่มเปลี่ยนธีมมุมขวา -->
    <nav class="fixed w-full z-40 bg-white/80 dark:bg-brand-900/90 backdrop-blur-lg border-b border-gray-200 dark:border-white/5 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center">
                    <a href="#" class="text-xl md:text-2xl font-bold tracking-tighter text-gray-900 dark:text-white flex items-center gap-2">
                        SARAN<span class="text-gray-400 dark:text-gray-500 font-light">PORTFOLIO</span>
                    </a>
                </div>
                
                <div class="flex items-center gap-4 md:gap-8">
                    <div class="hidden md:flex space-x-8 items-center">
                        <a href="#" class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition-colors">Home</a>
                        <a href="#gallery" class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition-colors">Gallery</a>
                        <a href="#" class="px-6 py-2.5 text-sm font-medium bg-gray-900 dark:bg-white text-white dark:text-brand-900 rounded-full hover:bg-gray-800 dark:hover:bg-gray-200 transition-colors shadow-lg">Contact Me</a>
                    </div>
                    
                    <!-- ปุ่มสลับธีม สไตล์มินิมอล -->
                    <button id="themeToggleBtn" class="p-2 rounded-full bg-gray-200 dark:bg-brand-800 text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition-colors shadow-inner" aria-label="Toggle Theme">
                        <!-- ไอคอนพระจันทร์จะโชว์ตอนอยู่ธีมสว่าง -->
                        <i id="theme-icon-moon" class="ph ph-moon text-xl hidden"></i>
                        <!-- ไอคอนพระอาทิตย์จะโชว์ตอนอยู่ธีมมืด -->
                        <i id="theme-icon-sun" class="ph ph-sun text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <header class="pt-32 pb-12 md:pt-48 md:pb-20 px-4 sm:px-6 lg:px-8 w-full max-w-7xl mx-auto text-center">
        <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight mb-6 leading-tight text-gray-900 dark:text-white">
            Capturing the beauty of <br class="hidden sm:block" /> 
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-500 to-gray-800 dark:from-gray-200 dark:to-gray-500">everyday moments.</span>
        </h1>
        <p class="text-base sm:text-lg md:text-xl text-gray-500 dark:text-gray-400 max-w-2xl mx-auto mb-10 font-light leading-relaxed px-4">
            "Hi, I'm Saran Thapkhwa (ศรัณ ทัพขวา). I love capturing everyday moments and telling stories through my camera. Welcome to my portfolio."
        </p>
    </header>

    <main id="gallery" class="flex-grow w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 pb-24">
        
        <div class="flex flex-wrap justify-center gap-2 md:gap-3 mb-12" id="filter-container">
            <!-- Buttons generated dynamically -->
        </div>

        <div id="image-container" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-4 md:gap-6 space-y-4 md:space-y-6">
            <!-- Images will be injected here -->
        </div>

    </main>

    <!-- ปรับ Lightbox: พื้นหลังโปร่งแสง เห็นหน้าเว็บลางๆ (เหมือนเดิม) -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-black/75 hidden opacity-0 transition-all duration-300 flex items-center justify-center backdrop-blur-sm w-full h-full p-4 md:p-8">
        <button id="lightbox-close" class="absolute top-4 right-4 md:top-6 md:right-6 text-gray-300 hover:text-white p-3 focus:outline-none z-50 bg-black/50 rounded-full backdrop-blur-md transition-colors shadow-lg">
            <i class="ph ph-x text-2xl"></i>
        </button>
        <button id="lightbox-prev" class="absolute left-2 md:left-8 text-gray-300 hover:text-white p-3 md:p-4 focus:outline-none z-50 bg-black/50 rounded-full backdrop-blur-md transition-colors hover:scale-110 shadow-lg">
            <i class="ph ph-caret-left text-xl md:text-2xl"></i>
        </button>
        <button id="lightbox-next" class="absolute right-2 md:right-8 text-gray-300 hover:text-white p-3 md:p-4 focus:outline-none z-50 bg-black/50 rounded-full backdrop-blur-md transition-colors hover:scale-110 shadow-lg">
            <i class="ph ph-caret-right text-xl md:text-2xl"></i>
        </button>
        
        <div class="relative w-full max-w-7xl h-full flex flex-col items-center justify-center px-10 md:px-24" id="lightbox-container">
            <div id="lightbox-loader" class="absolute inset-0 flex items-center justify-center z-0">
                <i class="ph ph-spinner-gap text-4xl animate-spin text-white/50"></i>
            </div>
            <img id="lightbox-img" src="" alt="Gallery image" class="max-w-[90%] md:max-w-full max-h-[80vh] object-contain shadow-2xl relative z-10 transition-all duration-300 scale-95 opacity-0 select-none rounded-md" draggable="false" oncontextmenu="return false;">
            <div id="lightbox-caption" class="text-center mt-4 text-gray-200 font-medium text-xs md:text-sm z-10 bg-black/60 px-6 py-2 rounded-full backdrop-blur-md shadow-lg"></div>
        </div>
    </div>

    <!-- ปุ่ม Scroll to Top สไตล์มินิมอล -->
    <button id="scrollToTopBtn" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 bg-gray-900 dark:bg-white text-white dark:text-brand-900 w-12 h-12 flex items-center justify-center rounded-full shadow-[0_4px_14px_0_rgba(0,0,0,0.39)] opacity-0 translate-y-4 pointer-events-none transition-all duration-300 z-40 hover:bg-gray-800 dark:hover:bg-gray-200 hover:scale-110">
        <i class="ph ph-arrow-up text-xl font-bold"></i>
    </button>

    <footer class="border-t border-gray-200 dark:border-white/5 bg-gray-50 dark:bg-brand-900 mt-auto py-10 w-full relative z-30 transition-colors duration-500">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-xs md:text-sm tracking-wide">&copy; <span id="year"></span> Saran Thapkhwa. All rights reserved.</p>
        </div>
    </footer>

    <!-- SECURITY SCRIPTS -->
    <script>
        if (window.top !== window.self) { window.top.location = window.self.location; }
        
        document.addEventListener('keydown', function(e) {
            if(e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
            if(e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) { e.preventDefault(); return false; }
            if(e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
            if(e.metaKey && e.altKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) { e.preventDefault(); return false; }
            if(e.metaKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
        });

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>

    <!-- SYSTEM SCRIPTS -->
    <script>
        // ระบบ Theme Toggle
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIconSun = document.getElementById('theme-icon-sun');
        const themeIconMoon = document.getElementById('theme-icon-moon');
        const html = document.documentElement;

        // เช็คค่า ธีม ที่บันทึกไว้ตอนโหลดหน้าเว็บ
        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
            themeIconSun.classList.add('hidden');
            themeIconMoon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIconSun.classList.add('hidden');
                themeIconMoon.classList.remove('hidden');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIconSun.classList.remove('hidden');
                themeIconMoon.classList.add('hidden');
            }
        });

        document.getElementById('year').textContent = new Date().getFullYear();

        const container = document.getElementById('image-container');
        const filterContainer = document.getElementById('filter-container');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxLoader = document.getElementById('lightbox-loader');
        const scrollToTopBtn = document.getElementById('scrollToTopBtn');

        let galleryData = [];
        let currentFilter = 'All';
        let currentImageIndex = 0;
        let filteredImages = [];

        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                scrollToTopBtn.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                scrollToTopBtn.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
            } else {
                scrollToTopBtn.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                scrollToTopBtn.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
            }
        });

        scrollToTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

        async function initGallery() {
            container.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center py-20">
                    <i class="ph ph-spinner-gap text-4xl animate-spin text-gray-400 dark:text-white/50 mb-4"></i>
                    <p class="text-gray-500 dark:text-gray-400">Loading your masterpiece...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/get-photos');
                if (!response.ok) throw new Error('Network error');
                galleryData = await response.json();
                
                if (galleryData.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-gray-500 py-20 text-lg">No images found in Google Drive.</p>';
                    return;
                }

                const categories = ['All', ...new Set(galleryData.map(item => item.category))];
                renderFilters(categories);
                renderGallery('All');
            } catch (error) {
                console.error(error);
                container.innerHTML = '<p class="col-span-full text-center text-red-500 py-20">Failed to load images.</p>';
            }
        }

        function renderFilters(categories) {
            filterContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.textContent = cat;
                
                // อัปเดตสไตล์ปุ่มหมวดหมู่ให้รองรับ 2 ธีม
                btn.className = `px-5 py-2 rounded-full text-xs md:text-sm font-medium transition-all duration-300 border ${
                    currentFilter === cat 
                    ? 'bg-gray-900 dark:bg-white text-white dark:text-brand-900 border-gray-900 dark:border-white shadow-lg scale-105' 
                    : 'bg-gray-200 dark:bg-brand-800/50 text-gray-500 dark:text-gray-400 border-gray-300 dark:border-white/5 hover:border-gray-400 dark:hover:border-white/20 hover:text-black dark:hover:text-white hover:bg-gray-300 dark:hover:bg-brand-800'
                }`;
                
                btn.onclick = () => {
                    currentFilter = cat;
                    renderFilters(categories);
                    renderGallery(cat);
                };
                filterContainer.appendChild(btn);
            });
        }

        function renderGallery(filterCategory) {
            container.innerHTML = '';
            filteredImages = filterCategory === 'All' ? galleryData : galleryData.filter(img => img.category === filterCategory);

            if(filteredImages.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-500 py-20 text-lg">No images found in this category.</p>`;
                return;
            }

            filteredImages.forEach((imgData) => {
                const globalIndex = galleryData.findIndex(item => item.id === imgData.id);
                
                const itemDiv = document.createElement('div');
                // เพิ่มสีพื้นหลังตอนโหลดของ 2 ธีม
                itemDiv.className = 'group relative overflow-hidden rounded-lg bg-gray-200 dark:bg-brand-800 cursor-pointer break-inside-avoid shadow-md hover:shadow-xl transition-all duration-300 hover:-translate-y-1';
                
                const img = document.createElement('img');
                img.src = imgData.src;
                img.alt = imgData.title;
                img.loading = 'lazy';
                img.draggable = false;
                img.oncontextmenu = () => false; 
                img.className = 'w-full h-auto object-cover opacity-0 select-none absolute inset-0'; 
                
                img.onload = () => {
                    img.classList.remove('opacity-0', 'absolute', 'inset-0');
                    img.classList.add('img-loaded', 'relative');
                };

                const overlay = document.createElement('div');
                overlay.className = 'absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4 md:p-5 pointer-events-none z-10';
                
                const title = document.createElement('h3');
                title.className = 'text-white font-medium text-sm md:text-base translate-y-4 group-hover:translate-y-0 transition-transform duration-300 ease-out';
                title.textContent = imgData.title; 

                overlay.appendChild(title);
                itemDiv.appendChild(img);
                itemDiv.appendChild(overlay);

                itemDiv.onclick = () => openLightbox(globalIndex);
                container.appendChild(itemDiv);
            });
        }

        function openLightbox(index) {
            currentImageIndex = index;
            updateLightboxContent();
            
            lightbox.classList.remove('hidden');
            requestAnimationFrame(() => { lightbox.classList.remove('opacity-0'); });
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lightbox.classList.add('opacity-0');
            lightboxImg.classList.remove('scale-100', 'opacity-100');
            lightboxImg.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                lightbox.classList.add('hidden');
                lightboxImg.src = ''; 
            }, 300);
            document.body.style.overflow = '';
        }

        function updateLightboxContent() {
            let viewList = currentFilter === 'All' ? galleryData : galleryData.filter(item => item.category === currentFilter);
            if (viewList.length === 0) return;

            let currentViewIndex = viewList.findIndex(item => item.id === galleryData[currentImageIndex].id);
            if (currentViewIndex === -1) currentViewIndex = 0;

            const imgData = viewList[currentViewIndex];
            
            lightboxImg.classList.remove('scale-100', 'opacity-100');
            lightboxImg.classList.add('scale-95', 'opacity-0');
            lightboxLoader.classList.remove('hidden');
            
            lightboxImg.src = imgData.src;
            lightboxImg.alt = imgData.title;
            lightboxCaption.textContent = `${imgData.title} — ${imgData.category}`;

            lightboxImg.onload = () => {
                lightboxLoader.classList.add('hidden');
                lightboxImg.classList.remove('scale-95', 'opacity-0');
                lightboxImg.classList.add('scale-100', 'opacity-100');
            };
        }

        function navigateLightbox(direction) {
            let viewList = currentFilter === 'All' ? galleryData : galleryData.filter(item => item.category === currentFilter);
            if (viewList.length <= 1) return;

            let currentViewIndex = viewList.findIndex(item => item.id === galleryData[currentImageIndex].id);
            let nextViewIndex = currentViewIndex + direction;

            if (nextViewIndex >= viewList.length) nextViewIndex = 0;
            if (nextViewIndex < 0) nextViewIndex = viewList.length - 1;

            const nextItem = viewList[nextViewIndex];
            currentImageIndex = galleryData.findIndex(item => item.id === nextItem.id);
            
            updateLightboxContent();
        }

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox-next').addEventListener('click', (e) => { e.stopPropagation(); navigateLightbox(1); });
        document.getElementById('lightbox-prev').addEventListener('click', (e) => { e.stopPropagation(); navigateLightbox(-1); });
        
        document.getElementById('lightbox-container').addEventListener('click', (e) => {
            if (e.target === document.getElementById('lightbox-container')) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') navigateLightbox(1);
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
            }
        });

        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
