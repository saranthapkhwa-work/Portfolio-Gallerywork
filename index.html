<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: { sans: ['Inter', 'sans-serif'], },
                colors: { brand: { 50: '#f6f6f6', 100: '#e7e7e7', 900: '#111111', } }
            }
        }
    }
</script>
<style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    
    .img-loaded { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.98); }
        to { opacity: 1; transform: scale(1); }
    }
</style>


<!-- Navigation -->
<nav class="fixed w-full z-40 bg-brand-900/90 backdrop-blur-md border-b border-white/10 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <div class="flex-shrink-0 flex items-center">
                <a href="#" class="text-2xl font-bold tracking-tighter text-white">
                    SARAN<span class="text-gray-500 font-light">PORTFOLIO</span>
                </a>
            </div>
            <div class="hidden md:flex space-x-8 items-center">
                <a href="#" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Home</a>
                <a href="#gallery" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Gallery</a>
                <a href="#contact" class="px-5 py-2 text-sm font-medium bg-white text-black rounded-full hover:bg-gray-200 transition-colors">Contact Me</a>
            </div>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<header class="pt-32 pb-16 md:pt-40 md:pb-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto text-center">
    <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold tracking-tight mb-6">
        Capturing the beauty of <br class="hidden md:block" /> everyday moments.
    </h1>
    <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto mb-10 font-light">
        Hi, I'm Saran Thapkhwa. A passionate photographer. Welcome to my visual journey.
    </p>
</header>

<!-- Main Gallery Section -->
<main id="gallery" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full pb-24">
    
    <!-- Filter Controls -->
    <div class="flex flex-wrap justify-center gap-3 mb-12" id="filter-container">
        <!-- Buttons generated by JS -->
    </div>

    <!-- Image Grid -->
    <div id="image-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
        <!-- Loader -->
        <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
            <i class="ph ph-spinner-gap text-4xl animate-spin mb-4"></i>
            <p>Loading photos from Google Drive...</p>
        </div>
    </div>

</main>

<!-- Lightbox Modal -->
<div id="lightbox" class="fixed inset-0 z-50 bg-black/95 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center backdrop-blur-sm">
    <button id="lightbox-close" class="absolute top-6 right-6 text-gray-400 hover:text-white p-2 focus:outline-none z-50">
        <i class="ph ph-x text-3xl"></i>
    </button>
    <button id="lightbox-prev" class="absolute left-4 md:left-10 text-gray-400 hover:text-white p-2 focus:outline-none z-50 hidden sm:block">
        <i class="ph ph-caret-left text-4xl"></i>
    </button>
    <button id="lightbox-next" class="absolute right-4 md:right-10 text-gray-400 hover:text-white p-2 focus:outline-none z-50 hidden sm:block">
        <i class="ph ph-caret-right text-4xl"></i>
    </button>
    <div class="relative max-w-5xl max-h-[90vh] px-4 w-full h-full flex flex-col items-center justify-center">
        <div id="lightbox-loader" class="absolute inset-0 flex items-center justify-center">
            <i class="ph ph-spinner-gap text-4xl animate-spin text-white/50"></i>
        </div>
        <img id="lightbox-img" src="" alt="Full size image" class="max-w-full max-h-[85vh] object-contain rounded-sm shadow-2xl relative z-10 transition-transform duration-300 scale-95">
        <div id="lightbox-caption" class="text-center mt-4 text-gray-300 font-light text-sm z-10"></div>
    </div>
</div>

<!-- Footer -->
<footer class="border-t border-white/10 bg-brand-900 mt-auto py-8">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <p class="text-gray-500 text-sm">&copy; <span id="year"></span> Saran Thapkhwa. All rights reserved.</p>
    </div>
</footer>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const gridContainer = document.getElementById('image-grid');
    const filterContainer = document.getElementById('filter-container');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const lightboxLoader = document.getElementById('lightbox-loader');

    let currentFilter = 'All';
    let currentImageIndex = 0;
    let filteredImages = [];
    window.galleryData = []; // เก็บข้อมูลจาก API

    // 1. Fetch Data from Vercel API
    async function loadImages() {
        try {
            // เรียกใช้ Vercel Serverless Function ของเรา
            const response = await fetch('/api/get-photos');
            if (!response.ok) throw new Error('Network response was not ok');
            
            const data = await response.json();
            window.galleryData = data;
            
            // Extract unique categories
            extractCategories(data);
            renderGallery('All');
        } catch (error) {
            console.error("Error loading images:", error);
            gridContainer.innerHTML = '<p class="col-span-full text-center text-red-500 py-10">Failed to load images. Please ensure API is connected.</p>';
        }
    }

    // 2. Extract Categories and Render Filters
    function extractCategories(data) {
        const uniqueCats = ['All', ...new Set(data.map(item => item.category))];
        renderFilters(uniqueCats);
    }

    function renderFilters(categories) {
        filterContainer.innerHTML = '';
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.textContent = cat;
            btn.className = `px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 border ${
                currentFilter === cat 
                ? 'bg-white text-black border-white' 
                : 'bg-transparent text-gray-400 border-gray-700 hover:border-gray-400 hover:text-white'
            }`;
            btn.addEventListener('click', () => {
                currentFilter = cat;
                renderFilters(categories); // Update active state
                renderGallery(cat); // Update grid
            });
            filterContainer.appendChild(btn);
        });
    }

    // 3. Render Gallery Grid
    function renderGallery(filterCategory) {
        gridContainer.innerHTML = '';
        
        filteredImages = filterCategory === 'All' 
            ? window.galleryData 
            : window.galleryData.filter(img => img.category === filterCategory);

        if(filteredImages.length === 0) {
            gridContainer.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No images found.</p>`;
            return;
        }

        filteredImages.forEach((imgData, index) => {
            const item = document.createElement('div');
            item.className = 'group relative overflow-hidden rounded-lg bg-gray-800 cursor-pointer aspect-[4/5] sm:aspect-square md:aspect-[3/4] hover:shadow-2xl transition-all duration-300';
            
            const img = document.createElement('img');
            img.src = imgData.src; // ใช้ src จาก API
            img.alt = imgData.title;
            img.loading = 'lazy';
            img.className = 'w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-0';
            
            img.onload = () => {
                img.classList.remove('opacity-0');
                img.classList.add('img-loaded');
            };

            const overlay = document.createElement('div');
            overlay.className = 'absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6';
            
            const title = document.createElement('h3');
            title.className = 'text-white font-semibold text-lg translate-y-4 group-hover:translate-y-0 transition-transform duration-300';
            title.textContent = imgData.title.split('.')[0]; // ลบนามสกุลไฟล์ออกตอนโชว์

            const categoryLabel = document.createElement('p');
            categoryLabel.className = 'text-gray-300 text-sm capitalize translate-y-4 group-hover:translate-y-0 transition-transform duration-300 delay-75';
            categoryLabel.textContent = imgData.category;

            overlay.appendChild(title);
            overlay.appendChild(categoryLabel);
            item.appendChild(img);
            item.appendChild(overlay);

            item.addEventListener('click', () => openLightbox(index));
            gridContainer.appendChild(item);
        });
    }

    // 4. Lightbox Functions
    function openLightbox(index) {
        currentImageIndex = index;
        updateLightboxContent();
        
        lightbox.classList.remove('hidden');
        setTimeout(() => {
            lightbox.classList.remove('opacity-0');
            lightboxImg.classList.remove('scale-95');
            lightboxImg.classList.add('scale-100');
        }, 10);
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.add('opacity-0');
        lightboxImg.classList.remove('scale-100');
        lightboxImg.classList.add('scale-95');
        
        setTimeout(() => {
            lightbox.classList.add('hidden');
            lightboxImg.src = ''; 
        }, 300);
        document.body.style.overflow = '';
    }

    function updateLightboxContent() {
        const imgData = filteredImages[currentImageIndex];
        lightboxLoader.classList.remove('hidden');
        lightboxImg.style.opacity = '0';
        
        lightboxImg.src = imgData.src;
        lightboxImg.alt = imgData.title;
        lightboxCaption.textContent = `${imgData.title.split('.')[0]} — ${imgData.category}`;

        lightboxImg.onload = () => {
            lightboxLoader.classList.add('hidden');
            lightboxImg.style.opacity = '1';
        };
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-next').addEventListener('click', (e) => {
        e.stopPropagation();
        currentImageIndex = (currentImageIndex + 1) % filteredImages.length;
        updateLightboxContent();
    });
    document.getElementById('lightbox-prev').addEventListener('click', (e) => {
        e.stopPropagation();
        currentImageIndex = (currentImageIndex - 1 + filteredImages.length) % filteredImages.length;
        updateLightboxContent();
    });

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.closest('.relative') === null) {
            closeLightbox();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('hidden')) {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
            if (e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
        }
    });

    // Start Fetching Data
    document.addEventListener('DOMContentLoaded', loadImages);
</script>
