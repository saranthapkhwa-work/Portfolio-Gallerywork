<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saran Thapkhwa (ศรัณ ทัพขวา) | Photography Portfolio</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], },
                    colors: { 
                        brand: { 50: '#f6f6f6', 100: '#e7e7e7', 800: '#1a1a1a', 900: '#0a0a0a' } 
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .img-loaded { animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-brand-900 text-brand-50 font-sans antialiased min-h-screen flex flex-col selection:bg-white selection:text-brand-900">

    <nav class="fixed w-full z-40 bg-brand-900/80 backdrop-blur-lg border-b border-white/5 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center">
                    <a href="#" class="text-2xl font-bold tracking-tighter text-white flex items-center gap-2">
                        SARAN<span class="text-gray-500 font-light">PORTFOLIO</span>
                    </a>
                </div>
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="#" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Home</a>
                    <a href="#gallery" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Gallery</a>
                    <a href="#contact" class="px-6 py-2.5 text-sm font-medium bg-white text-brand-900 rounded-full hover:bg-gray-200 transition-colors shadow-lg shadow-white/10">Contact Me</a>
                </div>
            </div>
        </div>
    </nav>

    <header class="pt-32 pb-16 md:pt-48 md:pb-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto text-center">
        <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold tracking-tight mb-6 leading-tight">
            Capturing the beauty of <br class="hidden md:block" /> <span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500">everyday moments.</span>
        </h1>
        <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto mb-10 font-light leading-relaxed">
            Hi, I'm Saran Thapkhwa (ศรัณ ทัพขวา). A passionate photographer. Welcome to my visual journey.
        </p>
    </header>

    <main id="gallery" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full pb-24">
        
        <!-- Filter Controls -->
        <div class="flex flex-wrap justify-center gap-2 md:gap-3 mb-12" id="filter-container">
            <!-- Buttons generated dynamically by JS -->
        </div>

        <!-- Image Grid -->
        <div id="image-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- Images will be injected here by JS -->
        </div>

    </main>

    <div id="lightbox" class="fixed inset-0 z-50 bg-black/98 hidden opacity-0 transition-all duration-300 flex items-center justify-center backdrop-blur-xl">
        <button id="lightbox-close" class="absolute top-6 right-6 text-gray-400 hover:text-white p-3 focus:outline-none z-50 bg-black/50 rounded-full backdrop-blur-md transition-colors">
            <i class="ph ph-x text-2xl"></i>
        </button>
        <button id="lightbox-prev" class="absolute left-4 md:left-8 text-gray-400 hover:text-white p-4 focus:outline-none z-50 hidden sm:block bg-black/50 rounded-full backdrop-blur-md transition-colors hover:scale-110">
            <i class="ph ph-caret-left text-2xl"></i>
        </button>
        <button id="lightbox-next" class="absolute right-4 md:right-8 text-gray-400 hover:text-white p-4 focus:outline-none z-50 hidden sm:block bg-black/50 rounded-full backdrop-blur-md transition-colors hover:scale-110">
            <i class="ph ph-caret-right text-2xl"></i>
        </button>
        
        <div class="relative max-w-6xl max-h-[90vh] px-4 w-full h-full flex flex-col items-center justify-center" id="lightbox-container">
            <div id="lightbox-loader" class="absolute inset-0 flex items-center justify-center z-0">
                <i class="ph ph-spinner-gap text-4xl animate-spin text-white/50"></i>
            </div>
            <img id="lightbox-img" src="" alt="Full size gallery image" class="max-w-full max-h-[80vh] object-contain shadow-2xl relative z-10 transition-all duration-300 scale-95 opacity-0 select-none">
            <div id="lightbox-caption" class="text-center mt-6 text-gray-300 font-medium text-sm md:text-base z-10 bg-black/50 px-6 py-2 rounded-full backdrop-blur-md"></div>
        </div>
    </div>

    <footer class="border-t border-white/5 bg-brand-900 mt-auto py-10">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm tracking-wide">&copy; <span id="year"></span> Saran Thapkhwa. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Set dynamic year
        document.getElementById('year').textContent = new Date().getFullYear();

        // DOM Elements
        const gridContainer = document.getElementById('image-grid');
        const filterContainer = document.getElementById('filter-container');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxLoader = document.getElementById('lightbox-loader');

        let currentFilter = 'All';
        let currentImageIndex = 0;
        let filteredImages = [];
        let galleryData = []; // เปลี่ยนเป็น empty array รอรับข้อมูลจาก API

        // ฟังก์ชันโหลดข้อมูลจาก Vercel API
        async function loadImagesFromAPI() {
            // แสดง Loader ตอนกำลังดึงรูป
            gridContainer.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center py-20">
                    <i class="ph ph-spinner-gap text-4xl animate-spin text-gray-400 mb-4"></i>
                    <p class="text-gray-400 text-lg">กำลังโหลดรูปภาพจาก Google Drive...</p>
                </div>
            `;
            
            try {
                const response = await fetch('/api/get-photos');
                if (!response.ok) throw new Error('API Error');
                
                galleryData = await response.json();
                
                if (galleryData.length === 0) {
                    gridContainer.innerHTML = '<p class="col-span-full text-center text-gray-500 py-20 text-lg">ยังไม่มีรูปภาพ กรุณาเพิ่มรูปลงใน Google Drive</p>';
                    return;
                }

                extractCategories(galleryData);
                renderGallery('All');
            } catch (error) {
                console.error('Error fetching data:', error);
                gridContainer.innerHTML = '<p class="col-span-full text-center text-red-400 py-20 text-lg">เกิดข้อผิดพลาดในการโหลดรูปภาพ</p>';
            }
        }

        function extractCategories(data) {
            // ดึงชื่อหมวดหมู่ทั้งหมด (ลบพวกหมวดหมู่จำลองทิ้ง ให้ดึงจากข้อมูลจริง)
            const baseCategories = ['All'];
            const dataCategories = data.map(item => item.category);
            const uniqueCats = [...new Set([...baseCategories, ...dataCategories])];
            renderFilters(uniqueCats);
        }

        function renderFilters(categories) {
            filterContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.textContent = cat;
                btn.className = `px-6 py-2.5 rounded-full text-sm font-medium transition-all duration-300 border ${
                    currentFilter === cat 
                    ? 'bg-white text-brand-900 border-white shadow-lg shadow-white/10 scale-105' 
                    : 'bg-brand-800/50 text-gray-400 border-white/5 hover:border-white/20 hover:text-white hover:bg-brand-800'
                }`;
                btn.addEventListener('click', () => {
                    currentFilter = cat;
                    renderFilters(categories); // Re-render to update active styling
                    renderGallery(cat);
                });
                filterContainer.appendChild(btn);
            });
        }

        function renderGallery(filterCategory) {
            gridContainer.innerHTML = '';
            
            filteredImages = filterCategory === 'All' 
                ? galleryData 
                : galleryData.filter(img => img.category === filterCategory);

            if(filteredImages.length === 0) {
                gridContainer.innerHTML = `<p class="col-span-full text-center text-gray-500 py-20 text-lg">ไม่มีรูปภาพในหมวดหมู่นี้</p>`;
                return;
            }

            filteredImages.forEach((imgData, index) => {
                const item = document.createElement('div');
                item.className = 'group relative overflow-hidden rounded-xl bg-brand-800 cursor-pointer aspect-[4/5] sm:aspect-square md:aspect-[3/4] transition-all duration-500 hover:shadow-2xl hover:shadow-black/50 hover:-translate-y-1';
                
                const img = document.createElement('img');
                img.src = imgData.src;
                // ลบนามสกุลไฟล์ .jpg, .png ออกตอนแสดงผลชื่อ
                const displayTitle = imgData.title ? imgData.title.split('.')[0] : 'Untitled'; 
                img.alt = displayTitle;
                img.loading = 'lazy';
                img.className = 'w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-0';
                
                img.onload = () => {
                    img.classList.remove('opacity-0');
                    img.classList.add('img-loaded');
                };

                const overlay = document.createElement('div');
                overlay.className = 'absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6';
                
                const title = document.createElement('h3');
                title.className = 'text-white font-semibold text-lg translate-y-4 group-hover:translate-y-0 transition-transform duration-300 ease-out';
                title.textContent = displayTitle; 

                const categoryLabel = document.createElement('p');
                categoryLabel.className = 'text-gray-400 text-sm font-medium tracking-wide uppercase mt-1 translate-y-4 group-hover:translate-y-0 transition-transform duration-300 ease-out delay-75';
                categoryLabel.textContent = imgData.category;

                overlay.appendChild(title);
                overlay.appendChild(categoryLabel);
                item.appendChild(img);
                item.appendChild(overlay);

                item.addEventListener('click', () => openLightbox(index));
                gridContainer.appendChild(item);
            });
        }

        function openLightbox(index) {
            currentImageIndex = index;
            updateLightboxContent();
            
            lightbox.classList.remove('hidden');
            requestAnimationFrame(() => {
                lightbox.classList.remove('opacity-0');
            });
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeLightbox() {
            lightbox.classList.add('opacity-0');
            lightboxImg.classList.remove('scale-100', 'opacity-100');
            lightboxImg.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                lightbox.classList.add('hidden');
                lightboxImg.src = ''; 
            }, 300);
            document.body.style.overflow = '';
        }

        function updateLightboxContent() {
            const imgData = filteredImages[currentImageIndex];
            
            // Reset image state for transition
            lightboxImg.classList.remove('scale-100', 'opacity-100');
            lightboxImg.classList.add('scale-95', 'opacity-0');
            lightboxLoader.classList.remove('hidden');
            
            // Set new source
            lightboxImg.src = imgData.src;
            const displayTitle = imgData.title ? imgData.title.split('.')[0] : 'Untitled';
            lightboxImg.alt = displayTitle;
            lightboxCaption.textContent = `${displayTitle} — ${imgData.category}`;

            // Animate in when loaded
            lightboxImg.onload = () => {
                lightboxLoader.classList.add('hidden');
                lightboxImg.classList.remove('scale-95', 'opacity-0');
                lightboxImg.classList.add('scale-100', 'opacity-100');
            };
        }

        // Event Listeners for Lightbox
        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        
        document.getElementById('lightbox-next').addEventListener('click', (e) => {
            e.stopPropagation();
            currentImageIndex = (currentImageIndex + 1) % filteredImages.length;
            updateLightboxContent();
        });
        
        document.getElementById('lightbox-prev').addEventListener('click', (e) => {
            e.stopPropagation();
            currentImageIndex = (currentImageIndex - 1 + filteredImages.length) % filteredImages.length;
            updateLightboxContent();
        });

        // Close on clicking outside the image
        document.getElementById('lightbox-container').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox-container') {
                closeLightbox();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
                if (e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
            }
        });

        // เปลี่ยนให้เรียกฟังก์ชันดึง API ตอนโหลดเว็บเสร็จ
        document.addEventListener('DOMContentLoaded', loadImagesFromAPI);
    </script>
</body>
</html>
